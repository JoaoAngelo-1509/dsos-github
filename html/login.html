<!DOCTYPE html>
  <!-- DSos v1.4 — login.html -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; connect-src 'self' https://*.supabase.co https://api.groq.com wss://*.supabase.co; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>DSos — Login</title>
  <link rel="shortcut icon" href="../images/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

<div class="bg"></div>

<button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
  <svg id="ico-tema" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="card">
  <p class="boas-vindas">Bem-vindo ao DSos — Sistema de HelpDesk Escolar. Faça login com as credenciais do seu PC.</p>

  <div class="field">
    <input id="nome" type="text" placeholder="Seu nome..." autocomplete="off" spellcheck="false" />
  </div>

  <div class="divisor"><span>credenciais do PC</span></div>

  <div class="field">
    <input id="usuario" type="text" placeholder="Usuário do PC..." autocomplete="off" spellcheck="false" />
  </div>

  <div class="field" style="position:relative;">
    <input id="senha" type="password" placeholder="Senha..." autocomplete="off" style="padding-right: 46px;" />
    <button type="button" onclick="toggleSenha()" id="btn-olho"
      style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0;color:var(--text-muted);">
      <svg id="icone-olho" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <div class="erro" id="erro">Usuário ou senha incorretos.</div>

  <button class="btn-entrar" id="btn" onclick="entrar()">
    <span>Entrar</span>
  </button>

  <img class="logo" id="egg-trigger" src="../images/Logo.png" alt="Centro Paula Souza" style="cursor:default" />

  <a class="ajuda" href="#" onclick="ajuda(event)">ajuda sobre login</a>
  <p style="font-size:.6rem;color:var(--text-muted,#666);text-align:center;margin-top:6px;margin-bottom:0">Esqueceu a senha? Contate o T.I.</p>
</div>

<!-- MODAL ESCOLHA TI / PROFESSOR -->
<div id="modal-escolha-bg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center;">
  <div style="background:var(--card-bg,#161616);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:32px 28px;width:320px;max-width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div style="font-size:.7rem;font-weight:700;letter-spacing:.12em;color:var(--text-muted,#888);margin-bottom:8px">ENTRAR COMO</div>
    <div style="font-size:1rem;font-weight:600;color:var(--text,#eee);margin-bottom:24px" id="escolha-nome-label"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button onclick="escolherTipo('ti')" style="padding:13px;border-radius:8px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text,#eee);font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.1)'" onmouseout="this.style.background='rgba(255,255,255,.05)'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Técnico T.I.
      </button>
      <button onclick="escolherTipo('professor')" style="padding:13px;border-radius:8px;border:1.5px solid rgba(6,182,212,.35);background:rgba(6,182,212,.08);color:var(--text,#eee);font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s" onmouseover="this.style.background='rgba(6,182,212,.18)'" onmouseout="this.style.background='rgba(6,182,212,.08)'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg>
        Professor
      </button>
    </div>
  </div>
</div>

<!-- EASTER EGG -->
<div class="egg-bg" id="egg-bg" onclick="fecharEgg()">
  <div class="egg-card">
    <img class="egg-img" id="egg-img" src="" alt="easter egg" onerror="this.src='https://placehold.co/320x400/1a1a1a/c0171a?text=📸+Foto+aqui'" />
    <div class="egg-nome" id="egg-nome">👀 Quem será?</div>
    <div class="egg-frase" id="egg-frase">"Não foi eu que deletei o banco."</div>
  </div>
  <div class="egg-close-hint">clique em qualquer lugar para fechar</div>
</div>

<script type="module" src="../js/auth.js"></script>
<script type="module">
  // easter egg dos 5 cliques — fonte única em js/easter-egg.js (DUP-06)
  import { initEasterEgg } from '../js/easter-egg.js';
  initEasterEgg();
</script>
</body>
</html>
